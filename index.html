<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아두이노 우노 R4 · LED 회로 시뮬레이션</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #10222c 0%, #071015 55%, #030507 100%);
    color: #e8eef2;
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  canvas#gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }

  /* 좌상단 정보 패널 */
  #panel {
    position: fixed; left: 18px; top: 16px; width: 300px;
    background: rgba(8, 16, 22, 0.72); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px; padding: 12px 14px 10px; backdrop-filter: blur(4px);
  }
  #panel .kicker { font-size: 11px; color: #7f97a6; letter-spacing: 0.04em; }
  #panel h1 { font-size: 17px; margin: 3px 0 6px; font-weight: 700; }
  #panel p { font-size: 12.5px; line-height: 1.55; margin: 0 0 8px; color: #c5d2da; min-height: 58px; }
  #graph { width: 100%; height: 120px; display: block; }
  #panel .row { display: flex; justify-content: space-between; font-size: 11.5px; color: #9fb2be; margin-top: 6px; }
  #panel .row b { color: #ffe45c; font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }

  /* 하단 버튼 줄 (오른쪽 아래는 발표자 영상 자리라 비워 둠) */
  #bar {
    position: fixed; left: 44%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; white-space: nowrap;
  }
  #bar button {
    font: inherit; font-size: 12px; color: #dfe8ee; cursor: pointer;
    background: rgba(22,32,40,0.88); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px; padding: 5px 10px;
  }
  #bar button:hover { background: rgba(48,62,72,0.95); }
  #bar button.on { background: #d93a4a; border-color: #d93a4a; color: #fff; }
  #bar .seg { display: flex; }
  #bar .seg button { border-radius: 0; margin-left: -1px; }
  #bar .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  #bar .seg button:last-child { border-radius: 0 6px 6px 0; }
  #bar label { font-size: 11px; color: #8ea2ae; display: flex; align-items: center; gap: 5px; }
  #bar input[type=range] { width: 80px; accent-color: #d93a4a; }
  #bar .gap { width: 8px; }

  /* 3D 위치에 붙는 글자 */
  .tag {
    position: fixed; left: 0; top: 0; pointer-events: none; display: none;
    font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(5, 10, 14, 0.78); border: 1px solid rgba(255,255,255,0.14);
    transform: translate(-50%, -50%); white-space: nowrap;
  }
  .tag.v5 { color: #ff6b6b; } .tag.v2 { color: #ffb347; } .tag.v0 { color: #6aa8ff; }
  .tag.drop { color: #ffe45c; font-size: 13px; }

  #tip {
    position: fixed; display: none; pointer-events: none; max-width: 240px;
    background: rgba(5, 10, 14, 0.9); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 7px; padding: 7px 10px; font-size: 12px; line-height: 1.5; color: #c5d2da;
  }
  #tip b { display: block; color: #fff; font-size: 13px; margin-bottom: 2px; }
  #note { position: fixed; right: 18px; top: 16px; width: 230px; text-align: right; font-size: 10.5px; line-height: 1.5; color: #5f7482; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="panel">
  <div class="kicker">아두이노 우노 R4 WiFi · LED 회로 &nbsp;<span id="stepNo"></span></div>
  <h1 id="stepT"></h1>
  <p id="stepD"></p>
  <canvas id="graph" width="544" height="240"></canvas>
  <div class="row">
    <span><span class="dot" style="background:#7fd4ff"></span>전자(−) &nbsp; <span style="color:#ffd84a">▶</span> 전류</span>
    <span>전류 <b>13.6 mA</b> (어디서나 같음)</span>
  </div>
</div>

<div id="bar">
  <button id="bPrev">◀ 이전</button>
  <button id="bNext">다음 ▶</button>
  <span class="gap"></span>
  <button id="bSee">속 보기</button>
  <button id="bExp">분해하기</button>
  <span class="gap"></span>
  <span class="seg">
    <button data-flow="current">전류</button>
    <button data-flow="electron">전자</button>
    <button data-flow="both">둘 다</button>
  </span>
  <button id="bVolt">전압 보기</button>
  <label>속도 <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></label>
</div>

<div id="tip"></div>
<div id="note">이해를 돕기 위해 전자의 움직임을 과장해 표현했습니다. 실제 전자는 1초에 1mm도 움직이지 않습니다.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ───────────────────────── 기본 장면 ─────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 16 / 9, 0.5, 400);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.AmbientLight(0xffffff, 0.32));
// 금속이 주변을 비추도록 간단한 반사 환경(위는 밝고 아래는 어두운 스튜디오)을 만든다
{
  const envTex = makeTextTexture(512, 256, (c) => {
    const g = c.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#f2f6fa'); g.addColorStop(0.45, '#6f7f8c'); g.addColorStop(0.55, '#27313a'); g.addColorStop(1, '#06090c');
    c.fillStyle = g; c.fillRect(0, 0, 512, 256);
    c.fillStyle = '#ffffff'; c.fillRect(60, 18, 110, 46); c.fillRect(300, 26, 150, 40);
  });
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(envTex).texture;
}
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(-20, 60, 40);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88bbff, 0.25);
fill.position.set(30, 20, -40);
scene.add(fill);

const v3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const VOLT_COLOR = { 5: 0xff3b3b, 2: 0xff9f1a, 0: 0x2f7bff };

// ───────────────────────── 재질 관리 ─────────────────────────
// 모든 겉면 재질을 등록해 두고, 속 보기에서 투명도를 한꺼번에 바꾼다
const shells = [];
function M(color, o = {}) {
  const m = new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.6, metalness: o.metal ?? 0,
    emissive: o.em ?? 0x000000, emissiveIntensity: o.ei ?? 1,
    opacity: o.op ?? 1, map: o.map ?? null,
  });
  shells.push({ m, see: o.see ?? 0.22, base: o.op ?? 1, volt: o.volt,
    col: new THREE.Color(color), em: new THREE.Color(o.em ?? 0x000000), ei: o.ei ?? 1 });
  return m;
}

// ───────────────────────── 부품 그룹 ─────────────────────────
// 각 그룹은 분해 보기에서 움직일 거리(off)와 이름표를 가진다
const parts = {};
function part(key, name, desc, off) {
  const g = new THREE.Group();
  g.userData = { info: { n: name, d: desc }, off: v3(off) };
  scene.add(g);
  parts[key] = g;
  return g;
}
const pickables = [];
function add(g, mesh, info) {
  mesh.userData.info = info || g.userData.info;
  g.add(mesh);
  pickables.push(mesh);
  return mesh;
}
function box(g, size, pos, mat, info) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  return add(g, m, info);
}
// 두 점을 잇는 원기둥(다리, 핀)
function rod(g, a, b, r, mat, info) {
  const A = v3(a), B = v3(b), d = B.clone().sub(A);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 12), mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return add(g, m, info);
}
function ball(g, p, r, mat, info) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat);
  m.position.set(p[0], p[1], p[2]);
  return add(g, m, info);
}

// 브레드보드 좌표: 구멍 간격 = 1, 5번 줄 x=7.5, 6번 줄 x=8.5, 10번 줄 x=12.5
// 아래쪽 구역 E행 z=2, D행 z=3, A행 z=6. 내부 클립 높이 y=2.2
const X5 = 7.5, X6 = 8.5, X10 = 12.5, ZE = 2, ZD = 3, ZA = 6, CY = 2.2;

// ───────────────────────── 아두이노 보드 ─────────────────────────
function makeTextTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function flatPlane(g, w, d, pos, mat) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(pos[0], pos[1], pos[2]);
  g.add(m);
  return m;
}

// LED 빛 번짐
const glowTex = makeTextTexture(128, 128, (c) => {
  const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
});
function glowSprite(color, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.set(size, size, 1);
  return s;
}
// 보드 좌표(bx: 왼쪽→오른쪽 0~27, bz: 디지털 헤더 쪽→전원 헤더 쪽 0~21, 단위 2.54mm)를 화면 좌표로 바꿈
const BX = (x) => -35.5 + x, BZ = (z) => -10.5 + z, PCB_Y = 0.8;
const P5 = BX(15), PG = BX(16);          // 5V 핀, GND 핀의 x 위치(실제 우노 핀 배열 기준)
const board = part('board', '아두이노 우노 R4 WiFi',
  'USB로 전원을 받아 5V 핀으로 내보내는 보드입니다. 이 회로에서는 건전지 같은 전원 역할만 합니다.', [-6, 0, 0]);
const bbox = (size, x, y, z, mat, info) => box(board, size, [BX(x), PCB_Y + y, BZ(z)], mat, info);
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
// 같은 모양을 여러 개 찍는 도우미. list 항목: [x, y, z, y축 회전]
function instanced(g, geo, mat, list) {
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const mm = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), ay = new THREE.Vector3(0, 1, 0);
  list.forEach((it, i) => {
    q.setFromAxisAngle(ay, it[3] || 0);
    mm.compose(new THREE.Vector3(it[0], it[1], it[2]), q, one);
    im.setMatrixAt(i, mm);
  });
  g.add(im);
  return im;
}
// 부품 윗면에 글자·무늬를 입히는 판
function topLabel(g, w, d, pos, draw, opt) {
  const tex = makeTextTexture(Math.round(w * 80), Math.round(d * 80), draw);
  return flatPlane(g, w, d, pos, M(0xffffff, Object.assign({ map: tex, see: 0.3, r: 0.5 }, opt || {})));
}

// 실제 우노 외곽선(오른쪽 모서리 꺾임)과 고정 구멍 4개
const OUTLINE = [[0, 21], [0, 0], [25.4, 0], [26, 0.6], [26, 5.1], [27, 6.1], [27, 19], [26, 20], [26, 21]];
const HOLES = [[5.51, 20], [6, 1], [26, 18], [26, 7]];
{
  const sh = new THREE.Shape();
  OUTLINE.forEach(([x, z], i) => { if (i) sh.lineTo(x, 21 - z); else sh.moveTo(x, 21 - z); });
  HOLES.forEach(([x, z]) => {
    const h = new THREE.Path();
    h.absarc(x, 21 - z, 0.63, 0, Math.PI * 2, true);
    sh.holes.push(h);
  });
  const pcb = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.6, bevelEnabled: false, curveSegments: 24 }),
    M(0x0f3a73, { r: 0.4, see: 0.3 }));
  pcb.rotation.x = -Math.PI / 2;
  pcb.position.set(-35.5, 0.2, 10.5);
  add(board, pcb);
}
// 기판 윗면: 배선 무늬 + 흰색 실크 인쇄
{
  const S = 80, px = (v) => v * S;
  const tex = makeTextTexture(27 * S, 21 * S, (c) => {
    c.beginPath();
    OUTLINE.forEach(([x, z], i) => { if (i) c.lineTo(px(x), px(z)); else c.moveTo(px(x), px(z)); });
    c.closePath();
    HOLES.forEach(([x, z]) => { c.moveTo(px(x) + px(0.63), px(z)); c.arc(px(x), px(z), px(0.63), 0, Math.PI * 2); });
    c.fillStyle = '#0b2c5e';
    c.fill('evenodd');
    c.clip('evenodd');
    // 구리 배선과 비아(장식)
    const tr = (pts) => { c.beginPath(); pts.forEach(([x, z], i) => { if (i) c.lineTo(px(x), px(z)); else c.moveTo(px(x), px(z)); }); c.stroke(); };
    c.strokeStyle = '#12417f'; c.lineWidth = 3;
    for (let i = 0; i < 8; i++) tr([[18 + i, 1.6], [18 + i, 4.3], [17.9 + i * 0.42, 4.9], [17.9 + i * 0.42, 5.4]]);
    for (let i = 0; i < 6; i++) tr([[9.2, 9.0 + i * 0.3], [9.9, 9.0 + i * 0.3], [10.6, 9.7 + i * 0.3], [11.6, 9.7 + i * 0.3]]);
    for (let i = 0; i < 6; i++) tr([[20 + i, 19.4], [20 + i, 18.6 - i * 0.05], [21.9 + i * 0.1, 16.9], [21.9 + i * 0.1, 9.4 - i * 0.25], [21.6, 9.1 - i * 0.25]]);
    for (let i = 0; i < 5; i++) tr([[2.7, 4.4 + i * 0.35], [3.6, 4.4 + i * 0.35], [4.6, 5.4 + i * 0.35], [9.3, 5.4 + i * 0.35]]);
    for (let i = 0; i < 12; i++) tr([[12.3 + i * 0.82, 10.4], [12.3 + i * 0.82, 16.4]]);
    for (let i = 0; i < 70; i++) {
      const x = 1 + rnd() * 25, z = 2.2 + rnd() * 16;
      c.fillStyle = '#12417f'; c.beginPath(); c.arc(px(x), px(z), 9, 0, 7); c.fill();
      c.fillStyle = '#061c3e'; c.beginPath(); c.arc(px(x), px(z), 4, 0, 7); c.fill();
    }
    // 고정 구멍 테두리, 금색 테스트 포인트
    c.strokeStyle = '#c9d3dc'; c.lineWidth = 14;
    HOLES.forEach(([x, z]) => { c.beginPath(); c.arc(px(x), px(z), px(0.78), 0, 7); c.stroke(); });
    c.fillStyle = '#d8b24a';
    [[3.6, 7.75], [4.2, 7.75], [4.8, 7.75], [5.4, 7.75], [6.0, 7.75], [3.6, 14.65], [4.3, 14.65], [5.0, 14.65],
      [16.2, 3.6], [16.9, 3.6], [22.6, 9.6], [9.9, 8.5], [10.5, 8.5]].forEach(([x, z]) => { c.beginPath(); c.arc(px(x), px(z), 11, 0, 7); c.fill(); });

    // 실크 인쇄
    const W = '#f4f6f8', DARK = '#0b2c5e';
    const vtext = (t, x, z, rot, o) => {
      o = o || {};
      c.save();
      c.translate(px(x), px(z));
      c.rotate(rot);
      c.font = (o.font || 'bold 28px') + ' Consolas, monospace';
      c.textAlign = o.align || 'left'; c.textBaseline = 'middle';
      if (o.box) {
        const w = c.measureText(t).width, x0 = o.align === 'center' ? -w / 2 : 0;
        c.fillStyle = W; c.fillRect(x0 - 7, -20, w + 14, 40);
        c.fillStyle = DARK;
      } else {
        c.fillStyle = o.color || W;
      }
      c.fillText(t, 0, 0);
      c.restore();
    };
    ['SCL', 'SDA', 'AREF', 'GND', '13', '12', '~11', '~10', '~9', '8'].forEach((n, i) => vtext(n, 7.4 + i, 1.78, Math.PI / 2, { box: n === 'GND' }));
    ['7', '~6', '~5', '4', '~3', '2', 'TX→1', 'RX←0'].forEach((n, i) => vtext(n, 18 + i, 1.78, Math.PI / 2));
    ['', 'IOREF', 'RESET', '3.3V', '5V', 'GND', 'GND', 'VIN'].forEach((n, i) => {
      if (n === 'GND') return;
      vtext(n, 11 + i, 19.32, -Math.PI / 2, n === '5V' ? { color: '#ffe45c', font: 'bold 34px' } : {});
    });
    c.fillStyle = W; c.fillRect(px(15.55), px(18.25), px(1.9), px(1.12));      // GND 두 칸을 묶은 흰 상자
    vtext('GND', 16.5, 18.81, 0, { align: 'center', color: DARK, font: 'bold 34px' });
    ['A0', 'A1', 'A2', 'A3', 'A4', 'A5'].forEach((n, i) => vtext(n, 20 + i, 19.32, -Math.PI / 2));
    ['OFF', 'GND', 'VRTC'].forEach((n, i) => vtext(n, 7.1 + i, 18.3, -Math.PI / 2, { box: n === 'GND', font: 'bold 24px' }));
    c.strokeStyle = W; c.lineWidth = 4;
    tr([[17.5, 3.55], [25.6, 3.55]]);
    tr([[10.6, 17.85], [25.6, 17.85]]);
    vtext('DIGITAL (PWM~)', 21.6, 4.0, 0, { align: 'center' });
    vtext('POWER', 14.5, 17.4, 0, { align: 'center', box: true, font: 'bold 26px' });
    vtext('ANALOG IN', 22.5, 17.4, 0, { align: 'center', box: true, font: 'bold 26px' });
    vtext('RESET', 4.2, 3.35, 0, { align: 'center', font: 'bold 24px' });
    vtext('L', 11.55, 3.6, 0, { font: 'bold 22px' });
    vtext('TX', 11.55, 4.15, 0, { font: 'bold 22px' });
    vtext('RX', 11.55, 4.7, 0, { font: 'bold 22px' });
    vtext('ON', 23.6, 9.25, 0, { align: 'center', font: 'bold 22px' });
    // 아두이노 로고(∞ 안에 −, +)와 제품명
    c.strokeStyle = W; c.lineWidth = 13;
    c.beginPath(); c.arc(px(12.62), px(5.75), px(0.58), 0, 7); c.stroke();
    c.beginPath(); c.arc(px(13.98), px(5.75), px(0.58), 0, 7); c.stroke();
    c.lineWidth = 8;
    tr([[12.38, 5.75], [12.86, 5.75]]);
    tr([[13.74, 5.75], [14.22, 5.75]]);
    tr([[13.98, 5.51], [13.98, 5.99]]);
    vtext('ARDUINO', 13.3, 6.95, 0, { align: 'center', font: 'bold 36px' });
    c.lineWidth = 4; c.strokeRect(px(11.9), px(7.5), px(1.65), px(0.8));
    vtext('UNO', 12.72, 7.92, 0, { align: 'center', font: 'bold 34px' });
    c.fillStyle = W; c.fillRect(px(13.55), px(7.5), px(1.2), px(0.8));
    vtext('R4', 14.15, 7.92, 0, { align: 'center', color: DARK, font: 'bold 34px' });
    c.fillStyle = W; c.fillRect(px(11.9), px(8.5), px(1.9), px(0.8));
    vtext('WIFI', 12.85, 8.92, 0, { align: 'center', color: DARK, font: 'bold 34px' });
  });
  const lm = M(0xffffff, { map: tex, see: 0.5, r: 0.42 });
  lm.alphaTest = 0.5;
  flatPlane(board, 27, 21, [-22, PCB_Y + 0.012, 0], lm);
}

  { tag: 'red',   p: RED_PTS, curve: true, v0: 5, v1: 5 },

const pathPts = [], pathCum = [];
let pathLen = 0;
SEGS.forEach((sg) => {
  if (sg.curve) {
    sg.curveObj = new THREE.CatmullRomCurve3(sg.p.map(v3), false, 'centripetal');
  }
  const pts = sg.curve ? sg.curveObj.getSpacedPoints(160) : sg.p.map(v3);
  sg.s0 = pathLen;
  pts.forEach((q, k) => {
    if (pathPts.length && k === 0) return;          // 앞 구간 끝점과 겹치는 점은 건너뜀
    if (pathPts.length) pathLen += q.distanceTo(pathPts[pathPts.length - 1]);
    pathPts.push(q);
    pathCum.push(pathLen);
  });
  sg.s1 = pathLen;
});
const segByTag = {};
SEGS.forEach((sg) => { segByTag[sg.tag] = sg; });

// 길 위의 거리 s 에서 위치·방향·전위를 구한다
const smp = { pos: new THREE.Vector3(), tan: new THREE.Vector3(), V: 0, tag: '' };
function sample(s) {
  s = ((s % pathLen) + pathLen) % pathLen;
  let sg = SEGS[SEGS.length - 1];
  for (const g of SEGS) {
    if (s >= g.s0 && s < g.s1) { sg = g; break; }
  }
  let lo = 0, hi = pathCum.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (pathCum[mid] <= s) lo = mid; else hi = mid;
  }
  const t = (s - pathCum[lo]) / Math.max(1e-6, pathCum[hi] - pathCum[lo]);
  smp.pos.lerpVectors(pathPts[lo], pathPts[hi], t);
  smp.tan.subVectors(pathPts[hi], pathPts[lo]).normalize();
  smp.V = sg.v0 + (sg.v1 - sg.v0) * (s - sg.s0) / (sg.s1 - sg.s0);
  smp.tag = sg.tag;
  return smp;
}

const ARROW_OFF = {
  red: [0, 0.8, 0], black: [0, 0.8, 0], clip10: [0, 1.6, 0], clip6: [0, 1.6, 0], clip5: [0, 1.6, 0],
  rlegR: [0, 1.0, 0], rbody: [0, 1.0, 0], rlegL: [0, 1.0, 0],
  ledA: [1.0, 0, 0], chip: [0, 2.0, 0], ledK: [-1.0, 0, 0],
};
const E_LOW = new THREE.Color(0x3d7fe0), E_HIGH = new THREE.Color(0xb5f0ff);
const tM = new THREE.Matrix4(), tQ = new THREE.Quaternion(), tP = new THREE.Vector3(), tC = new THREE.Color();
const UP = new THREE.Vector3(0, 1, 0), ONE = new THREE.Vector3(1, 1, 1), ZERO = new THREE.Vector3(0, 0, 0), QI = new THREE.Quaternion();
let offE = 0, offA = 0, offT = 0;

function updateFlow(dt, time) {
  const sp = state.speed;
  offE += dt * 5 * sp;
  offA += dt * 8 * sp;
  offT += dt * 26 * sp;
  if (electrons.visible) {
    for (let i = 0; i < N_E; i++) {
      // 전자는 전류와 반대 방향(−s)으로 움직인다. 간격은 어디서나 같다(개수 보존)
      const s = sample(i / N_E * pathLen - offE);
      tP.copy(s.pos);
      if (s.tag === 'rbody') {          // 저항 속에서는 원자와 부딪혀 흔들림
        tP.y += 0.2 * Math.sin(time * 23 + i * 7.3);
        tP.z += 0.2 * Math.cos(time * 19 + i * 5.1);
      }
      tM.compose(tP, QI, ONE);
      electrons.setMatrixAt(i, tM);
      // 전자의 에너지는 전위가 낮을수록 크다 → 0V 쪽에서 밝고 5V 쪽에서 어둡다
      tC.copy(E_LOW).lerp(E_HIGH, 1 - s.V / 5);
      electrons.setColorAt(i, tC);
    }
    electrons.instanceMatrix.needsUpdate = true;
    electrons.instanceColor.needsUpdate = true;
  }
  if (arrows.visible) {
    for (let i = 0; i < N_A; i++) {
      const s = sample(i / N_A * pathLen + offA);
      const o = ARROW_OFF[s.tag];
      if (!o) {
        tM.compose(s.pos, QI, ZERO);    // 보드 속 구간에서는 숨김
      } else {
        tP.set(s.pos.x + o[0], s.pos.y + o[1], s.pos.z + o[2]);
        tQ.setFromUnitVectors(UP, s.tan);
        tM.compose(tP, tQ, ONE);
      }
      arrows.setMatrixAt(i, tM);
    }
    arrows.instanceMatrix.needsUpdate = true;
  }
  if (tracer.visible) {
    const s = sample(offT);
    const o = ARROW_OFF[s.tag];
    tracer.scale.setScalar(o ? 1 : 0.001);
    if (o) tracer.position.set(s.pos.x + o[0], s.pos.y + o[1], s.pos.z + o[2]);
  }
  for (let i = 0; i < ATOMS; i++) {
    tP.copy(atomHome[i]);
    tP.y += 0.03 * Math.sin(time * 30 + i * 3);
    tP.z += 0.03 * Math.cos(time * 27 + i * 4);
    tM.compose(tP, QI, ONE);
    atoms.setMatrixAt(i, tM);
  }
  atoms.instanceMatrix.needsUpdate = true;
}

const gcv = document.getElementById('graph'), g2 = gcv.getContext('2d');
const B1 = segByTag.rbody.s0, B2 = segByTag.rbody.s1, B3 = segByTag.chip.s0, B4 = segByTag.chip.s1, B5 = segByTag.src.s0;
// 길 위의 거리 s → 그래프 가로 위치(0~1). 보드 속 구간은 -1
function graphX(s) {
  s = ((s % pathLen) + pathLen) % pathLen;
  if (s < B1) return 0.28 * s / B1;
  if (s < B2) return 0.28 + 0.14 * (s - B1) / (B2 - B1);
  if (s < B3) return 0.42 + 0.16 * (s - B2) / (B3 - B2);
  if (s < B4) return 0.58 + 0.14 * (s - B3) / (B4 - B3);
  if (s < B5) return 0.72 + 0.28 * (s - B4) / (B5 - B4);
  return -1;
}
function drawGraph() {
  const W = gcv.width, H = gcv.height, L = 62, R = W - 16, T = 22, Bm = H - 44;
  const X = (u) => L + (R - L) * u, Y = (v) => Bm - (Bm - T) * v / 5;
  g2.clearRect(0, 0, W, H);
  g2.font = '20px Malgun Gothic, sans-serif';
  g2.textBaseline = 'middle';
  // 눈금
  g2.strokeStyle = 'rgba(255,255,255,0.12)'; g2.lineWidth = 1; g2.fillStyle = '#8ea2ae'; g2.textAlign = 'right';
  for (const v of [0, 2, 5]) {
    g2.beginPath(); g2.moveTo(L, Y(v)); g2.lineTo(R, Y(v)); g2.stroke();
    g2.fillText(v + 'V', L - 8, Y(v));
  }
  g2.textAlign = 'center';
  [['5V 핀', 0.04], ['저항', 0.35], ['LED', 0.65], ['GND', 0.96]].forEach(([n, u]) => g2.fillText(n, X(u), H - 18));
  // 계단 모양 전위선
  const hot = state.step === 3 ? 1 : state.step === 4 ? 3 : -1;
  const pts = [[0, 5], [0.28, 5], [0.42, 2], [0.58, 2], [0.72, 0], [1, 0]];
  const cols = ['#ff4d4d', '#ffe45c', '#ff9f1a', '#ffe45c', '#4d8dff'];
  for (let i = 0; i < 5; i++) {
    g2.strokeStyle = cols[i];
    g2.lineWidth = i === hot ? 9 : 4;
    g2.lineCap = 'round';
    g2.beginPath(); g2.moveTo(X(pts[i][0]), Y(pts[i][1])); g2.lineTo(X(pts[i + 1][0]), Y(pts[i + 1][1])); g2.stroke();
  }
  g2.fillStyle = '#ffe45c'; g2.textAlign = 'left';
  g2.fillText('−3.0V', X(0.37), Y(3.9));
  g2.fillText('−2.0V', X(0.67), Y(1.4));
  // 전류를 따라 움직이는 점
  if (state.flow !== 'none' && !state.explode) {
    const u = graphX(state.flow === 'trace' ? offT : offA);
    if (u >= 0) {
      let v = 5;
      if (u > 0.28) v = u < 0.42 ? 5 - 3 * (u - 0.28) / 0.14 : u < 0.58 ? 2 : u < 0.72 ? 2 - 2 * (u - 0.58) / 0.14 : 0;
      g2.fillStyle = '#fff';
      g2.beginPath(); g2.arc(X(u), Y(v), 7, 0, Math.PI * 2); g2.fill();
    }
  }
}

const camTween = { t: 1, p0: new THREE.Vector3(), p1: new THREE.Vector3(), q0: new THREE.Vector3(), q1: new THREE.Vector3() };
function moveCamera(cam, tgt, instant) {
  camTween.p0.copy(camera.position); camTween.q0.copy(controls.target);
  camTween.q1.set(tgt[0], tgt[1], tgt[2]);
  // 화면이 16:9보다 좁으면 그만큼 뒤로 물러나 회로 전체가 보이게 함
  const asp = (camera.aspect > 0 && isFinite(camera.aspect)) ? camera.aspect : 16 / 9;
  const back = Math.max(1, (16 / 9) / asp);
  if (!isFinite(camera.position.x)) camTween.p0.set(cam[0], cam[1], cam[2]);
  camTween.p1.set(cam[0], cam[1], cam[2]).sub(camTween.q1).multiplyScalar(back).add(camTween.q1);
  camTween.t = instant ? 0.999 : 0;
}
function goStep(i, instant) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[state.step];
  state.see = s.see; state.flow = s.flow; state.volt = s.volt; state.explode = false;
  moveCamera(s.cam, s.tgt, instant);
  applyState();
}

const $ = (id) => document.getElementById(id);
function applyState() {
  const s = STEPS[state.step];
  $('stepNo').textContent = (state.step + 1) + ' / ' + STEPS.length;
  $('stepT').textContent = (state.step + 1) + '단계 · ' + s.t;
  $('stepD').textContent = s.d;
  $('bSee').textContent = state.see ? '겉 보기' : '속 보기';
  $('bExp').textContent = state.explode ? '다시 합치기' : '분해하기';
  $('bExp').classList.toggle('on', state.explode);
  $('bVolt').classList.toggle('on', state.volt);
  document.querySelectorAll('#bar .seg button').forEach((b) => b.classList.toggle('on', b.dataset.flow === state.flow));
  // 전압 보기: 전위가 정해진 부품을 전위 색으로 물들임
  for (const sh of shells) {
    if (sh.volt === undefined) continue;
    if (state.volt) {
      sh.m.color.setHex(VOLT_COLOR[sh.volt]);
      sh.m.emissive.setHex(VOLT_COLOR[sh.volt]);
      sh.m.emissiveIntensity = 0.75;
    } else {
      sh.m.color.copy(sh.col);
      sh.m.emissive.copy(sh.em);
      sh.m.emissiveIntensity = sh.ei;
    }
  }
}

$('bPrev').onclick = () => goStep(state.step - 1);
$('bNext').onclick = () => goStep(state.step + 1);
$('bSee').onclick = () => { state.see = !state.see; applyState(); };
$('bExp').onclick = () => {
  state.explode = !state.explode;
  const c = state.explode ? CAM_EXP : STEPS[state.step];
  moveCamera(c.cam, c.tgt);
  applyState();
};
$('bVolt').onclick = () => { state.volt = !state.volt; applyState(); };
$('speed').oninput = (e) => { state.speed = parseFloat(e.target.value); };
document.querySelectorAll('#bar .seg button').forEach((b) => {
  b.onclick = () => {
    state.flow = b.dataset.flow;
    if (state.flow !== 'current') state.see = true;     // 전자는 도선 속에 있으므로 속 보기로 전환
    applyState();
  };
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goStep(state.step + 1);
  if (e.key === 'ArrowLeft') goStep(state.step - 1);
});

// ───────────────────────── 마우스 올리면 설명 ─────────────────────────
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
renderer.domElement.addEventListener('pointermove', (e) => {
  mouse.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = e.buttons ? null : ray.intersectObjects(pickables, false)[0];
  if (!hit) { tip.style.display = 'none'; return; }
  const info = hit.object.userData.info;
  tip.innerHTML = '<b></b><span></span>';
  tip.firstChild.textContent = info.n;
  tip.lastChild.textContent = info.d;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 260) + 'px';
  tip.style.top = (e.clientY + 16) + 'px';
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; });

// ───────────────────────── 매 프레임 ─────────────────────────
let seeK = 0, expK = 0, last = performance.now();
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / (window.innerHeight || 1);
  camera.updateProjectionMatrix();
  // 창 크기가 바뀌면 현재 단계 구도로 다시 맞춤
  const c = state.explode ? CAM_EXP : STEPS[state.step];
  moveCamera(c.cam, c.tgt, true);
}
window.addEventListener('resize', resize);

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), time = now / 1000;
  last = now;
  const k = Math.min(1, dt * 5);
  seeK += ((state.see ? 1 : 0) - seeK) * k;
  expK += ((state.explode ? 1 : 0) - expK) * k;

  // 속 보기: 겉면을 투명하게
  for (const sh of shells) {
    const op = sh.base + (sh.see * sh.base - sh.base) * seeK;
    sh.m.opacity = op;
    sh.m.transparent = op < 0.99 || sh.m.alphaTest > 0;
    sh.m.depthWrite = op > 0.9;
  }
  // 분해 보기: 부품을 제자리에서 떼어 냄
  for (const key in parts) {
    parts[key].position.copy(parts[key].userData.off).multiplyScalar(expK);
  }

  const flowing = expK < 0.03;
  electrons.visible = flowing && seeK > 0.3 && (state.flow === 'electron' || state.flow === 'both');
  arrows.visible = flowing && (state.flow === 'current' || state.flow === 'both');
  tracer.visible = flowing && state.flow === 'trace';
  atoms.visible = seeK > 0.3;
  updateFlow(dt, time);

  // 저항은 열, LED는 빛
  const pulse = 0.5 + 0.5 * Math.sin(time * 4);
  resBodyMat.emissiveIntensity = (state.step === 3 && flowing) ? 0.35 + 0.35 * pulse : 0.08;
  ledGlow.material.opacity = 0.75 + 0.2 * pulse;

  if (camTween.t < 1) {
    camTween.t = Math.min(1, camTween.t + dt / 1.4);
    const e = camTween.t < 0.5 ? 2 * camTween.t * camTween.t : 1 - Math.pow(-2 * camTween.t + 2, 2) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.q0, camTween.q1, e);
  }
  controls.update();
  renderer.render(scene, camera);
  updateTags();
  drawGraph();
  requestAnimationFrame(frame);
}

resize();
goStep(0, true);
requestAnimationFrame(frame);
</script>
</body>
